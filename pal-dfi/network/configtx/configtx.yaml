Organizations:

  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: ../organizations/ordererOrganizations/orderer.ps/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"

      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"

      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"


  - &PMA
    Name: PMAMSP
    ID: PMAMSP
    MSPDir: ../organizations/peerOrganizations/pma.ps/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PMAMSP.member')"

      Writers:
        Type: Signature
        Rule: "OR('PMAMSP.member')"

      Admins:
        Type: Signature
        Rule: "OR('PMAMSP.member')"

      Endorsement:
        Type: Signature
        Rule: "OR('PMAMSP.peer')"

    AnchorPeers:
      - Host: peer0.pma.ps
        Port: 7051


  - &MOI
    Name: MOIMSP
    ID: MOIMSP
    MSPDir: ../organizations/peerOrganizations/moi.ps/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('MOIMSP.member')"

      Writers:
        Type: Signature
        Rule: "OR('MOIMSP.member')"

      Admins:
        Type: Signature
        Rule: "OR('MOIMSP.member')"

      Endorsement:
        Type: Signature
        Rule: "OR('MOIMSP.peer')"

    AnchorPeers:
      - Host: peer0.moi.ps
        Port: 7051


  - &JAWWAL
    Name: JAWWALMSP
    ID: JAWWALMSP
    MSPDir: ../organizations/peerOrganizations/jawwal.ps/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('JAWWALMSP.member')"

      Writers:
        Type: Signature
        Rule: "OR('JAWWALMSP.member')"

      Admins:
        Type: Signature
        Rule: "OR('JAWWALMSP.member')"

      Endorsement:
        Type: Signature
        Rule: "OR('JAWWALMSP.peer')"

    AnchorPeers:
      - Host: peer0.jawwal.ps
        Port: 7051


Capabilities:

  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_5: true


Application: &ApplicationDefaults
  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

  Capabilities:
    <<: *ApplicationCapabilities


Orderer: &OrdererDefaults
  OrdererType: solo

  Addresses:
    - orderer.ps:7050

  BatchTimeout: 2s

  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "ANY Admins"

    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

  Organizations:

  Capabilities:
    <<: *OrdererCapabilities


Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"

    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"

    Admins:
      Type: ImplicitMeta
      Rule: "ANY Admins"

  Capabilities:
    <<: *ChannelCapabilities


Profiles:

  PalDFIOrdererGenesis:
    <<: *ChannelDefaults

    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg

    Consortiums:
      PalDFIConsortium:
        Organizations:
          - *PMA
          - *MOI
          - *JAWWAL


  PalDFIChannel:
    Consortium: PalDFIConsortium

    <<: *ChannelDefaults

    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *PMA
        - *MOI
        - *JAWWAL