version: '3.9'

services:

  ####################################################
  # FABRIC CERTIFICATE AUTHORITIES
  ####################################################

  ca.orderer.ps:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca.orderer.ps
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_TLS_ENABLED=true
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ./network/fabric-ca/orderer:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric_net

  ca.moi.ps:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca.moi.ps
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-moi
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_TLS_ENABLED=true
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ./network/fabric-ca/moi:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric_net

  ca.pma.ps:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca.pma.ps
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-pma
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_TLS_ENABLED=true
    ports:
      - "9054:9054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ./network/fabric-ca/pma:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric_net

  ca.jawwal.ps:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca.jawwal.ps
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-jawwal
      - FABRIC_CA_SERVER_PORT=10054
      - FABRIC_CA_SERVER_TLS_ENABLED=true
    ports:
      - "10054:10054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ./network/fabric-ca/jawwal:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric_net

  ####################################################
  # MYSQL DATABASES
  ####################################################

  mysql-moi:
    image: mysql:8.0
    container_name: mysql-moi
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOI_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3317:3306"
    volumes:
      - moi_mysql_data:/var/lib/mysql
      - ./databases/moi:/docker-entrypoint-initdb.d
    networks:
      - fabric_net

  mysql-pma:
    image: mysql:8.0
    container_name: mysql-pma
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PMA_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3318:3306"
    volumes:
      - pma_mysql_data:/var/lib/mysql
      - ./databases/pma:/docker-entrypoint-initdb.d
    networks:
      - fabric_net

  mysql-jawwal:
    image: mysql:8.0
    container_name: mysql-jawwal
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${JAWWAL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3319:3306"
    volumes:
      - jawwal_mysql_data:/var/lib/mysql
      - ./databases/jawwal:/docker-entrypoint-initdb.d
    networks:
      - fabric_net

  ####################################################
  # COUCHDB
  ####################################################

  couchdb-moi:
    image: couchdb:3.3
    container_name: couchdb-moi
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    networks:
      - fabric_net

  couchdb-pma:
    image: couchdb:3.3
    container_name: couchdb-pma
    ports:
      - "6984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    networks:
      - fabric_net

  couchdb-jawwal:
    image: couchdb:3.3
    container_name: couchdb-jawwal
    ports:
      - "7984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    networks:
      - fabric_net

  ####################################################
  # GO APPS
  ####################################################

  moi-app:
    build:
      context: ./apps/moi
    container_name: moi-app
    ports:
      - "${MOI_PORT}:8080"
    depends_on:
      - mysql-moi
    networks:
      - fabric_net

  pma-app:
    build:
      context: ./apps/pma
    container_name: pma-app
    ports:
      - "${PMA_PORT}:8080"
    depends_on:
      - mysql-pma
    networks:
      - fabric_net

  jawwal-app:
    build:
      context: ./apps/jawwal
    container_name: jawwal-app
    ports:
      - "${JAWWAL_PORT}:8080"
    depends_on:
      - mysql-jawwal
    networks:
      - fabric_net

networks:
  fabric_net:

volumes:
  moi_mysql_data:
  pma_mysql_data:
  jawwal_mysql_data: